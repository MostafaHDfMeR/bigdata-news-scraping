version: '3.8' 
#Volumes persistants 
volumes:
  postgres_airflow_db:
  postgres_dw_data:
  minio_data:
  redis_data:

#Réseau partagé 
networks:
  bigdata_net:
    driver: bridge

#Configuration commune Airflow 
x-airflow-common: &airflow-common
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres_airflow/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      beautifulsoup4 requests pandas pyarrow minio psycopg2-binary langdetect kafka-python lxml
    # Variables personnalisées pour le projet
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin123
    DW_CONN_STRING: postgresql+psycopg2://datawarehouse:dw_password_2026@postgres_dw/news_dw
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./kafka:/opt/airflow/kafka
  networks:
    - bigdata_net
  depends_on:
    - postgres_airflow
    - redis

services:

  #PostgreSQL pour Airflow (métadonnées)
  postgres_airflow:
    image: postgres:13
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_db:/var/lib/postgresql/data
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  #PostgreSQL pour le Data Warehouse
  postgres_dw:
    image: postgres:13
    container_name: postgres_dw
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datawarehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dw_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-news_dw}
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"    # Port 5433 pour éviter conflit avec l'autre Postgres
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-datawarehouse}"]
      interval: 10s
      retries: 5

  #pgadmin (interface web pour PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_dw
    networks:
      - bigdata_net

  #Redis (broker Celery pour Airflow)
  redis:
    image: redis:7.2-bookworm
    container_name: redis
    expose:
      - 6379
    volumes:
      - redis_data:/data
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50

  #MinIO (Data Lake S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web
    volumes:
      - minio_data:/data
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD-SHELL", "test -d /data"]
      interval: 30s
      timeout: 20s
      retries: 3

  #Zookeeper (requis par Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bigdata_net
    
  #Apache Kafka (streaming)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bigdata_net
  #Kafka (consumer)
  kafka-consumer:
   build: .
   container_name: kafka_consumer
   command: python kafka/consumer.py
   volumes:
      - ./kafka:/opt/airflow/kafka
      - ./dags:/opt/airflow/dags
   depends_on:
     - kafka
     - minio
   networks:
     - bigdata_net

  #Kafdrop (interface web pour Kafka)
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    ports:
      - "9200:9000"   # évite conflit avec MinIO
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
    depends_on:
      - kafka
    networks:
      - bigdata_net

  #Airflow Init
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    restart: on-failure

  #Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  #Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: always

  #Airflow Worker (Celery)
  airflow-worker:
    <<: *airflow-common
    container_name: airflow_worker
    command: celery worker
    restart: always